<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1d12">
<title>Bonkosaurus – Stone Age Smash-Up</title>
<style>
:root{--u:min(1vw,0.56vh);--ink:#3b2a1a;--edge:#5e4a34;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#2a1d12;overflow:hidden;overscroll-behavior:none;
 font-family:"Chalkboard SE","Marker Felt","Bradley Hand","Comic Sans MS","Comic Neue","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
body{background:radial-gradient(circle at 50% 30%,#4a3322,#1d130b)}
#app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:min(100vw,56vh);overflow:hidden;background:#8fd8ff;box-shadow:0 0 0 calc(var(--u)*1.2) #5e4a34,0 0 80px rgba(0,0,0,.6);touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;z-index:10;padding:calc(env(safe-area-inset-top) + var(--u)*4) calc(var(--u)*5) calc(env(safe-area-inset-bottom) + var(--u)*3)}
.btn{font:inherit;font-weight:900;font-size:calc(var(--u)*6.2);letter-spacing:.04em;color:var(--ink);border:calc(var(--u)*1) solid var(--edge);border-radius:calc(var(--u)*5);
 background:linear-gradient(#e6d6b8,#b09a74);padding:calc(var(--u)*2.6) calc(var(--u)*6);cursor:pointer;
 box-shadow:0 calc(var(--u)*1.6) 0 #4a3828,inset 0 calc(var(--u)*.8) 0 rgba(255,255,255,.45),0 calc(var(--u)*2.5) calc(var(--u)*3) rgba(0,0,0,.3);
 transition:transform .06s,box-shadow .06s;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn:active:not(:disabled){transform:translateY(calc(var(--u)*1.2));box-shadow:0 calc(var(--u)*.4) 0 #4a3828,inset 0 calc(var(--u)*.8) 0 rgba(255,255,255,.4)}
.btn.go{background:linear-gradient(#ffd27a,#f08a00);border-color:#8a4b00;box-shadow:0 calc(var(--u)*1.6) 0 #7a3f00,inset 0 calc(var(--u)*.8) 0 rgba(255,255,255,.5),0 calc(var(--u)*2.5) calc(var(--u)*3) rgba(0,0,0,.3)}
.btn.green{background:linear-gradient(#a8f08a,#3fae2a);border-color:#1f6a12;box-shadow:0 calc(var(--u)*1.6) 0 #1a560e,inset 0 calc(var(--u)*.8) 0 rgba(255,255,255,.5)}
.btn.big{font-size:calc(var(--u)*11);padding:calc(var(--u)*3.6) calc(var(--u)*14);animation:bob 1.6s ease-in-out infinite}
.btn.small{font-size:calc(var(--u)*4.6);padding:calc(var(--u)*1.8) calc(var(--u)*4)}
.btn:disabled{filter:grayscale(.7) brightness(.9);cursor:default;opacity:.85}
.btn.round{width:calc(var(--u)*11);height:calc(var(--u)*11);padding:0;border-radius:50%;font-size:calc(var(--u)*5.6);display:grid;place-items:center}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(calc(var(--u)*-1.2)) rotate(1deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#menu{justify-content:space-between}
.title-wrap{text-align:center;margin-top:calc(var(--u)*5)}
.title{font-weight:900;font-size:calc(var(--u)*19);line-height:.92;letter-spacing:.03em;color:#fff3d1;
 -webkit-text-stroke:calc(var(--u)*1.1) var(--ink);paint-order:stroke fill;
 text-shadow:0 calc(var(--u)*1.2) 0 #7a4a22,0 calc(var(--u)*2.4) 0 #4a2e14,0 calc(var(--u)*4) calc(var(--u)*4) rgba(0,0,0,.4);transform:rotate(-3deg);animation:pop .5s both}
.title span{color:#ffb02e}
.tag{margin-top:calc(var(--u)*3);display:inline-block;background:#3b2a1a;color:#ffe9a8;border-radius:calc(var(--u)*4);padding:calc(var(--u)*1) calc(var(--u)*4);font-weight:900;font-size:calc(var(--u)*4);letter-spacing:.08em;transform:rotate(1deg)}
.menu-mid{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3.2);margin-top:calc(var(--u)*2);margin-bottom:calc(var(--u)*40)}
.pill{background:rgba(59,42,26,.88);color:#ffe9a8;border-radius:calc(var(--u)*5);padding:calc(var(--u)*1.4) calc(var(--u)*4);font-weight:900;font-size:calc(var(--u)*4.4);border:calc(var(--u)*.6) solid #7a5a38;white-space:nowrap}
.pill b{color:#fff}
#btnDaily{font-size:calc(var(--u)*4.6);padding:calc(var(--u)*2) calc(var(--u)*5)}
#btnDaily.ready{animation:bob 1.1s ease-in-out infinite}
.menu-foot{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.5)}
.equip-line{font-weight:900;font-size:calc(var(--u)*3.6);color:#fff;text-shadow:0 2px 0 #3b2a1a,0 0 6px #3b2a1a}
.credit{font-weight:900;font-size:calc(var(--u)*3.3);color:#fff3d1;opacity:.95;text-shadow:0 2px 0 #3b2a1a,0 0 6px #3b2a1a;letter-spacing:.06em}
#btnMute{position:absolute;z-index:30;top:calc(env(safe-area-inset-top) + var(--u)*2.5);right:calc(var(--u)*3)}
#hud{position:absolute;inset:0;z-index:8;pointer-events:none}
.hud-top{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);top:calc(env(safe-area-inset-top) + var(--u)*2.5);display:flex;align-items:flex-start;gap:calc(var(--u)*2)}
.score-box{background:rgba(59,42,26,.88);border:calc(var(--u)*.7) solid #7a5a38;border-radius:calc(var(--u)*4);padding:calc(var(--u)*.8) calc(var(--u)*4);color:#fff3d1;min-width:calc(var(--u)*30)}
.score-box small{display:block;font-size:calc(var(--u)*2.8);letter-spacing:.15em;color:#ffcf6a;font-weight:900}
#hScore{font-size:calc(var(--u)*8.5);font-weight:900;line-height:1}
.hud-spacer{flex:1}
#btnPause{pointer-events:auto;margin-right:calc(var(--u)*13)}
.hud-row2{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);top:calc(env(safe-area-inset-top) + var(--u)*21);display:flex;justify-content:space-between;align-items:center}
#hLives{font-size:calc(var(--u)*6.4);letter-spacing:calc(var(--u)*.6);filter:drop-shadow(0 2px 0 rgba(59,42,26,.8))}
#hTime{font-weight:900;font-size:calc(var(--u)*8);color:#fff;-webkit-text-stroke:calc(var(--u)*1) var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
#hTime.low{color:#ff6b5a;animation:wob .4s infinite}
#timebar{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);top:calc(env(safe-area-inset-top) + var(--u)*32);height:calc(var(--u)*2.6);background:rgba(59,42,26,.7);border-radius:calc(var(--u)*2);border:calc(var(--u)*.5) solid #7a5a38;overflow:hidden}
#timebar i{display:block;height:100%;width:100%;background:linear-gradient(#ffe27a,#ff9f1c);border-radius:calc(var(--u)*2)}
#timebar.low i{background:linear-gradient(#ff8a7a,#e8453c)}
#hBones{position:absolute;left:calc(var(--u)*3);top:calc(env(safe-area-inset-top) + var(--u)*14.5);font-size:calc(var(--u)*3.8);padding:calc(var(--u)*.4) calc(var(--u)*3)}
#comboWrap{position:absolute;left:calc(var(--u)*3);top:calc(env(safe-area-inset-top) + var(--u)*37);display:flex;align-items:center;gap:calc(var(--u)*2);opacity:0;transition:opacity .15s}
#comboWrap.on{opacity:1}
#hMult{font-weight:900;font-size:calc(var(--u)*10);color:#ffd84d;-webkit-text-stroke:calc(var(--u)*1.1) var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);min-width:calc(var(--u)*17)}
#hCombo{font-weight:900;font-size:calc(var(--u)*4);color:#fff;text-shadow:0 2px 0 var(--ink),0 0 5px var(--ink)}
#comboBar{width:calc(var(--u)*20);height:calc(var(--u)*2.2);background:rgba(59,42,26,.7);border-radius:calc(var(--u)*2);overflow:hidden;border:calc(var(--u)*.4) solid #7a5a38;margin-top:calc(var(--u)*1)}
#comboBar i{display:block;height:100%;width:0;background:linear-gradient(#a8f08a,#3fae2a)}
.overlay{background:rgba(30,18,8,.55);justify-content:center}
.card-modal{background:linear-gradient(#f1e4c6,#d3bd92);border:calc(var(--u)*1.2) solid var(--edge);border-radius:calc(var(--u)*6);padding:calc(var(--u)*5) calc(var(--u)*5);width:100%;text-align:center;
 box-shadow:0 calc(var(--u)*2) 0 #4a3828,0 calc(var(--u)*4) calc(var(--u)*6) rgba(0,0,0,.45);animation:pop .35s both}
.card-modal h2{margin:0;font-size:calc(var(--u)*9);font-weight:900;color:#c4511a;-webkit-text-stroke:calc(var(--u)*.7) var(--ink);paint-order:stroke fill;text-shadow:0 calc(var(--u)*.8) 0 rgba(59,42,26,.6)}
.big-score{font-size:calc(var(--u)*18);font-weight:900;line-height:1.05;color:#fff;-webkit-text-stroke:calc(var(--u)*1.2) var(--ink);paint-order:stroke fill;text-shadow:0 calc(var(--u)*1) 0 var(--ink)}
.ribbon{display:inline-block;background:#e8453c;color:#fff;font-weight:900;letter-spacing:.08em;padding:calc(var(--u)*.8) calc(var(--u)*4);border-radius:calc(var(--u)*2);transform:rotate(-3deg);font-size:calc(var(--u)*4.4);border:calc(var(--u)*.5) solid #7a1a14;animation:bob 1s infinite}
.rows{margin:calc(var(--u)*3) 0;display:flex;flex-direction:column;gap:calc(var(--u)*1.2);font-weight:900;font-size:calc(var(--u)*4.4)}
.rows div{display:flex;justify-content:space-between;background:rgba(255,255,255,.35);border-radius:calc(var(--u)*2.5);padding:calc(var(--u)*1.2) calc(var(--u)*3)}
.rows .total{background:var(--ink);color:#ffe9a8;font-size:calc(var(--u)*5.6)}
.btnrow{display:flex;flex-direction:column;gap:calc(var(--u)*2.4);align-items:stretch}
.btnrow .row2{display:flex;gap:calc(var(--u)*2.4)}.btnrow .row2 .btn{flex:1;padding-left:0;padding-right:0}
.hintline{font-weight:900;font-size:calc(var(--u)*3.8);margin:calc(var(--u)*1) 0 calc(var(--u)*2.5);color:#2f6a12}
#shop{background:linear-gradient(#6e4f32,#3a2616);padding-left:calc(var(--u)*3);padding-right:calc(var(--u)*3)}
.shop-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*2)}
.shop-head h2{margin:0;font-size:calc(var(--u)*9);color:#ffe9a8;-webkit-text-stroke:calc(var(--u)*.8) var(--ink);paint-order:stroke fill;text-shadow:0 calc(var(--u)*1) 0 var(--ink)}
.tabs{display:flex;width:100%;gap:calc(var(--u)*2);margin:calc(var(--u)*3) 0 calc(var(--u)*2)}
.tab{flex:1;position:relative;font:inherit;font-weight:900;font-size:calc(var(--u)*3.9);padding:calc(var(--u)*2) calc(var(--u)*1);border-radius:calc(var(--u)*3.5);border:calc(var(--u)*.8) solid var(--edge);background:#8c7656;color:#e8d9b8;cursor:pointer}
.emrow{font-size:calc(var(--u)*3.8);line-height:1.2;text-align:center;white-space:nowrap;letter-spacing:calc(var(--u)*.2);font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.emrow.bad{background:rgba(70,190,100,.22);border-radius:calc(var(--u)*3);padding:0 calc(var(--u)*2);margin:calc(var(--u)*.6) 0}
.tab.active{background:linear-gradient(#ffd27a,#f08a00);color:var(--ink);border-color:#8a4b00;box-shadow:inset 0 calc(var(--u)*.7) 0 rgba(255,255,255,.5)}
.tab .dot{position:absolute;top:calc(var(--u)*-1.2);right:calc(var(--u)*-.5);background:#e8453c;color:#fff;border-radius:50%;width:calc(var(--u)*5);height:calc(var(--u)*5);font-size:calc(var(--u)*3.4);display:grid;place-items:center;border:2px solid #fff}
.shop-list{flex:1;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2.6);padding:calc(var(--u)*1.5) calc(var(--u)*.5) calc(var(--u)*4);align-content:start;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.shop-list::-webkit-scrollbar{width:6px}.shop-list::-webkit-scrollbar-thumb{background:#a8946f;border-radius:4px}
.item{position:relative;background:linear-gradient(#f1e4c6,#d3bd92);border:calc(var(--u)*.9) solid var(--edge);border-radius:calc(var(--u)*4.5);padding:calc(var(--u)*2) calc(var(--u)*2) calc(var(--u)*2.4);display:flex;flex-direction:column;align-items:center;text-align:center;gap:calc(var(--u)*1);box-shadow:0 calc(var(--u)*1) 0 #4a3828}
.item.equipped{border-color:#1f6a12;background:linear-gradient(#e2f6c8,#b4de8a);box-shadow:0 calc(var(--u)*1) 0 #1a560e,0 0 calc(var(--u)*4) rgba(140,255,100,.5)}
.item.shake{animation:wob .3s}
.portrait{width:calc(var(--u)*27);height:calc(var(--u)*27);background:radial-gradient(circle,#fff8e0,#e8d3a4);border-radius:calc(var(--u)*4);border:calc(var(--u)*.6) solid #b59c6c}
.item.locked .portrait{filter:grayscale(.85) brightness(.82)}
.item.locked .portrait.bgp{filter:saturate(.8) brightness(.88)}
.lock{position:absolute;top:calc(var(--u)*2);right:calc(var(--u)*2.5);font-size:calc(var(--u)*5.2)}
.gtag{position:absolute;top:calc(var(--u)*2);left:calc(var(--u)*2.5);font-size:calc(var(--u)*2.6);font-weight:900;border-radius:calc(var(--u)*2);padding:0 calc(var(--u)*1.4);color:#fff;border:1px solid rgba(0,0,0,.4)}
.gtag.f{background:#e0558f}.gtag.m{background:#3f8ad8}
.iname{font-weight:900;font-size:calc(var(--u)*4.2);line-height:1.05}
.iperk{font-weight:700;font-size:calc(var(--u)*3);line-height:1.15;color:#5b4128;min-height:calc(var(--u)*7)}
.chips{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1);justify-content:center}
.chip{background:rgba(59,42,26,.82);color:#ffe9a8;border-radius:calc(var(--u)*2);padding:0 calc(var(--u)*1.6);font-size:calc(var(--u)*2.8);font-weight:900}
.ibtn{width:100%;font:inherit;font-weight:900;font-size:calc(var(--u)*4.2);padding:calc(var(--u)*1.7) calc(var(--u)*1);border-radius:calc(var(--u)*3.5);border:calc(var(--u)*.8) solid #8a4b00;cursor:pointer;
 background:linear-gradient(#ffd27a,#f08a00);color:var(--ink);box-shadow:0 calc(var(--u)*.9) 0 #7a3f00}
.ibtn:active:not(:disabled){transform:translateY(calc(var(--u)*.7));box-shadow:0 calc(var(--u)*.2) 0 #7a3f00}
.ibtn.equip{background:linear-gradient(#bfe9ff,#5fb4e8);border-color:#1f5f8a;box-shadow:0 calc(var(--u)*.9) 0 #194b6e}
.ibtn.on{background:linear-gradient(#a8f08a,#3fae2a);border-color:#1f6a12;box-shadow:none;cursor:default}
.ibtn.cant{background:linear-gradient(#bdb3a2,#8f8573);border-color:#5e5546;box-shadow:0 calc(var(--u)*.9) 0 #4a4337;color:#4a4033}
.need{font-size:calc(var(--u)*2.9);font-weight:900;color:#a8321f;min-height:calc(var(--u)*3.4)}
#toast{position:absolute;z-index:60;left:50%;bottom:calc(env(safe-area-inset-bottom) + var(--u)*14);transform:translate(-50%,20px);background:var(--ink);color:#ffe9a8;font-weight:900;font-size:calc(var(--u)*4.2);padding:calc(var(--u)*2) calc(var(--u)*5);border-radius:calc(var(--u)*5);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;border:calc(var(--u)*.6) solid #ffcf6a;max-width:96%}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.btn.big,#btnDaily.ready,.ribbon{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <button id="btnMute" class="btn round" aria-label="Toggle sound">🔊</button>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="score-box"><small>SCORE</small><div id="hScore">0</div></div>
      <div class="hud-spacer"></div>
      <button id="btnPause" class="btn round" aria-label="Pause">⏸</button>
    </div>
    <div class="hud-row2"><div id="hLives"></div><div id="hTime">40</div></div>
    <div id="timebar"><i></i></div>
    <div class="pill" id="hBones">🦴 <b id="hBonesN">0</b></div>
    <div id="comboWrap"><div id="hMult">x1</div><div><div id="hCombo">0 combo</div><div id="comboBar"><i></i></div></div></div>
  </div>

  <section id="menu" class="screen">
    <div class="title-wrap">
      <div class="title">BONKO<br><span>SAURUS</span></div>
      <div class="tag">SMASH. BONK. REPEAT.</div>
    </div>
    <div class="menu-mid">
      <button id="btnPlay" class="btn go big">▶ PLAY</button>
      <button id="btnShop" class="btn">🛒 SHOP</button>
      <button id="btnDaily" class="btn green">🎁 DAILY BONUS</button>
      <div class="pill">🏆 Best <b id="mBest">0</b> &nbsp;·&nbsp; 🦴 <b id="mBones">0</b></div>
    </div>
    <div class="menu-foot">
      <div class="equip-line" id="mEquip"></div>
      <div class="credit">Created by Togi Clips</div>
    </div>
  </section>

  <section id="pause" class="screen overlay hidden" style="z-index:40">
    <div class="card-modal">
      <h2>PAUSED</h2>
      <div class="btnrow" style="margin-top:calc(var(--u)*4)">
        <button id="btnResume" class="btn go">▶ RESUME</button>
        <button id="btnQuit" class="btn">🏠 QUIT ROUND</button>
      </div>
    </div>
  </section>

  <section id="over" class="screen overlay hidden">
    <div class="card-modal">
      <h2 id="oTitle">TIME'S UP!</h2>
      <div id="oRibbon" class="ribbon hidden">★ NEW BEST! ★</div>
      <div class="big-score" id="oScore">0</div>
      <div class="rows">
        <div><span>💥 Smashed</span><span id="oSmash">0</span></div>
        <div><span>🔥 Best combo</span><span id="oCombo">0</span></div>
        <div><span>🦴 From smashing</span><span id="oB1">+0</span></div>
        <div><span>🎁 Round bonus</span><span id="oB2">+0</span></div>
        <div class="total"><span>🦴 Earned</span><span id="oB3">+0</span></div>
      </div>
      <div class="hintline" id="oHint"></div>
      <div class="btnrow">
        <button id="btnAgain" class="btn go">↻ PLAY AGAIN</button>
        <div class="row2"><button id="btnOShop" class="btn small">🛒 SHOP</button><button id="btnOMenu" class="btn small">🏠 MENU</button></div>
      </div>
    </div>
  </section>

  <section id="shop" class="screen hidden">
    <div class="shop-head">
      <button id="btnBack" class="btn small">← BACK</button>
      <h2>SHOP</h2>
      <div class="pill" style="margin-right:calc(var(--u)*13)">🦴 <b id="sBones">0</b></div>
    </div>
    <div class="tabs">
      <button class="tab active" id="tabChars" data-tab="chars">🧑 Cave Folk</button>
      <button class="tab" id="tabTools" data-tab="tools">🏏 Weapons</button>
      <button class="tab" id="tabBgs" data-tab="bgs">🌄 Scenes</button>
    </div>
    <div class="shop-list" id="shopList"></div>
  </section>

  <div id="toast"></div>
</div>

<script>
(() => {
'use strict';
/* ====================== CONSTANTS & DATA ====================== */
const W = 400;
const DUR = 40;                       // round length (seconds)
const INK = '#3b2a1a';
const FONT = '"Chalkboard SE","Marker Felt","Comic Sans MS","Comic Neue","Trebuchet MS",system-ui,sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
const KEY = 'bonkosaurus.save.v1';
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

const CHARS = [
  {id:'grug',  name:'Grug',            g:'m', price:0,    perk:'Humble start. All heart, no perks.',       fx:{},                                 look:{skin:'#e8b88a',hair:'messy',hc:'#5a3418',outfit:'#b5792f',o2:'#7a4c18',beard:true}},

function spawnItem() {
  const p = G.time / DUR, ease = G.ease;
  const badP = (.10 + .12 * p) * (G.easy ? .75 : 1);
  let def; const r = Math.random();
  if (r < badP) def = wpick(G.set.bad, d => d.w);
  else if (r > .965 && p > .12) def = G.set.golden;
  else def = wpick(G.set.good, d => d.w * (d.late ? (G.easy ? Math.max(.1, p * 1.2 - .1) : .35 + p) : 1));
  const toss = G.time > 5 && Math.random() < (.16 + .22 * p);
  const it = { def, hp: def.hp, maxhp: def.hp, rot: rand(-.3, .3), vr: rand(-1.2, 1.2), flash: 0, age: 0, ph: rand(0, 6.28), mode: toss ? 'toss' : 'fall', dead: false };
  const hs = H / 700;
  if (toss) {
    it.x = rand(70, W - 70); it.y = groundY + def.r * .5;
    const apex = H * rand(.32, .56), g = 520 * hs; it.g = g; it.vy = -Math.sqrt(2 * g * apex);
    it.vx = clamp((W / 2 - it.x) * rand(.1, .4), -70, 70) + rand(-25, 25); it.vr *= 2;
  } else {
    let x = rand(def.r + 14, W - def.r - 14);
    for (let k = 0; k < 8; k++) { if (!G.items.some(o => o.y < 90 && Math.abs(o.x - x) < 62)) break; x = rand(def.r + 14, W - def.r - 14); }
    it.x0 = x; it.x = x; it.y = -def.r - 4; it.vy = (95 + 150 * p) * ease * hs * rand(.9, 1.12);
    it.amp = rand(0, 18) * (.3 + p); it.freq = rand(1.4, 3);
  }
  G.items.push(it);
}

function addText(x, y, text, col, size, life, o) { G.texts.push(Object.assign({ x, y, text, col, size, life, max: life, vy: -45 }, o || {})); }
function burst(x, y, cols, n, power, o) {
  o = o || {};
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, sp = rand(.25, 1) * power;
    G.parts.push({ type: o.type || (Math.random() < .5 ? 'rect' : 'circ'), x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - power * .35, g: o.g == null ? 700 : o.g, life: rand(.4, .9), max: .9, size: rand(3, 8) * (o.size || 1), col: pick(cols), rot: rand(0, 6), vr: rand(-10, 10) }); }

function smash(px, py) {
  if (!G || mode !== 'playing') return;
  const R = G.R, tool = G.tool;
  G.face = px < G.charX ? -1 : 1; G.charTX = clamp(px, 50, W - 50); G.swingT = .28; G.squash = 1;
  G.slams.push({ x: px, y: py, t: 0, tool });
  G.rings.push({ x: px, y: py, r: R * .5, max: R, t: 0, life: .22, col: 'rgba(255,255,255,.9)' });
  const targets = G.items.filter(it => { if (it.dead) return false; const d = Math.hypot(it.x - px, it.y - py); return it.def.good ? d < R + it.def.r * .5 : d < R * .55 + it.def.r * .55; });

  const hitSet = new Set(goods);
  for (const it of goods) damage(it, tool.dmg);
  if (G.fx.burn) {   // lava shockwave: burns nearby GOOD items only
    G.rings.push({ x: px, y: py, r: R * .6, max: R * G.fx.burn, t: 0, life: .35, col: 'rgba(255,140,30,.9)' });
    burst(px, py, ['#ff7a1a', '#ffd84d', '#ff4a00'], 14, 220, { g: 100, type: 'circ' });
    for (const it of G.items) { if (it.dead || hitSet.has(it) || !it.def.good) continue; if (Math.hypot(it.x - px, it.y - py) < R * G.fx.burn + it.def.r * .4) damage(it, 1); }
  }

      b.dead = true;
      G.parts.push({ type: 'emoji', e: b.def.e, size: b.def.r * 1.95, x: b.x, y: b.y, vx: rand(-200, 200), vy: -rand(380, 520), g: 900, life: 1.4, max: 1.4, rot: 0, vr: rand(-9, 9), col: '#fff' });
      addText(b.x, b.y - 30, 'AWW! ' + b.def.name, '#ff6b6b', 22, 1.3);
    }
    loseLife(px, py);
  }
  if (goods.length) G.shake = Math.max(G.shake, 4 + Math.min(goods.length, 4) * 1.5);
}
function damage(it, dmg) {
  const d = it.def;

  if (it.hp > 0) { Snd.crack(); burst(it.x, it.y, d.col, 8, 170, { g: 600 }); addText(it.x, it.y - d.r, 'CRACK!', '#fff', 18, .6); G.shake = Math.max(G.shake, 3); return; }

  G.combo++; G.comboT = G.comboWin; G.maxCombo = Math.max(G.maxCombo, G.combo);
  const mult = multOf(G.combo);
  const pts = Math.round(d.pts * mult * G.fx.score);
  G.score += pts;
  const b = (d.bones || 1) * G.fx.bones; G.bonesF += b;
  const big = !!d.gold;
  Snd.smash(d.kind, big); Snd.pop(G.combo);
  burst(it.x, it.y, d.col, big ? 30 : 14, big ? 380 : 260, { size: big ? 1.3 : 1 });
  if (d.kind === 'rock') burst(it.x, it.y, ['#d8d0c0', '#bbbbbb'], 8, 120, { g: 150, size: 1.6 });
  if (d.kind === 'tech') burst(it.x, it.y, ['#ffffff', '#69b4ff', '#ffd84d'], 8, 300, { type: 'star', g: 200, size: 1.1 });
  if (big) burst(it.x, it.y, ['#ffffff', '#ffd84d'], 14, 300, { type: 'star', g: 100, size: 1.5 });
  addText(it.x, it.y - d.r * .6, '+' + pts, mult > 1 ? '#ffd84d' : '#ffffff', 20 + mult * 2 + (big ? 8 : 0), .9);
  flyBones(it.x, it.y, big ? 6 : (b > 1.2 ? 2 : 1));

  if (G.combo % 5 === 0) { Snd.combo(G.combo); addText(W / 2, H * .3, 'COMBO x' + G.combo + '!', '#ffd84d', 32 + mult * 2, 1.0, { vy: -20 }); G.shake = Math.max(G.shake, 8); }

}

  G.items.length = 0;
  mode = 'over';
  $('oTitle').textContent = G.endReason === 'time' ? "TIME'S UP!" : 'BONKED OUT!';
  $('oScore').textContent = fmt(G.score); $('oSmash').textContent = G.smashed; $('oCombo').textContent = 'x' + G.maxCombo;
  $('oB1').textContent = '+' + b1; $('oB2').textContent = '+' + b2; $('oB3').textContent = '+0';
  $('oRibbon').classList.toggle('hidden', !newBest);
  const un = [...CHARS.filter(c => !save.ownedChars.includes(c.id)), ...TOOLS.filter(t => !save.ownedTools.includes(t.id)), ...BGS.filter(b => !save.ownedBgs.includes(b.id))];
  const aff = un.filter(x => x.price <= save.bones).sort((a, b) => b.price - a.price);
  const nxt = un.sort((a, b) => a.price - b.price)[0];
  $('oHint').textContent = aff.length ? '🛒 You can afford: ' + aff[0].name + '!' : (nxt ? 'Next: ' + nxt.name + ' (' + fmt(nxt.price - save.bones) + ' 🦴 to go)' : 'You own everything. Legend!');
  hide(el.hud); show(el.over);
  countUp($('oB3'), total, 900);
}
function countUp(node, to, ms) {
  const t0 = performance.now();
  const step = now => { const p = clamp((now - t0) / ms, 0, 1); node.textContent = '+' + Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1 && mode === 'over') requestAnimationFrame(step); else node.textContent = '+' + to; };
  requestAnimationFrame(step);
}

/* ---------- update ---------- */
function update(dt) {
  clock += dt;
  if (mode === 'menu' || mode === 'shop' || !G) { updateAmbient(dt); return; }
  if (mode === 'playing') {
    G.time += dt;
    const p = G.time / DUR;
    if (G.hint > 0) G.hint -= dt;
    G.spawnT -= dt;
    if (G.spawnT <= 0) {
      spawnItem(); if (p > .5 && Math.random() < .25 + (p - .5) * .5) spawnItem();
      G.spawnT = lerp(1.15, .42, p) / G.ease * rand(.85, 1.15);
    }
    if (!G.flags.a && p >= .33) { G.flags.a = true; addText(W / 2, H * .3, 'FASTER!', '#ff9f1c', 40, 1.1); Snd.faster(); }
    if (!G.flags.b && p >= .66) { G.flags.b = true; addText(W / 2, H * .3, 'EVEN FASTER!!', '#ff5a4a', 38, 1.1); Snd.faster(); }
    if (G.combo > 0) { G.comboT -= dt; if (G.comboT <= 0) G.combo = 0; }
    const left = Math.ceil(DUR - G.time);
    if (left <= 5 && left > 0 && left !== G.lastTick) { G.lastTick = left; Snd.tick(); }
    if (G.time >= DUR) endRound('time');
  } else if (mode === 'ending') {
    G.endT += dt; if (G.endT > 1.5) finishRound();
  }
  for (const it of G.items) {
    it.age += dt; it.rot += it.vr * dt; if (it.flash > 0) it.flash -= dt;
    if (it.mode === 'fall') { it.y += it.vy * dt; it.x = clamp(it.x0 + Math.sin(it.age * it.freq + it.ph) * it.amp, it.def.r, W - it.def.r); }
    else { it.vy += it.g * dt; it.x += it.vx * dt; it.y += it.vy * dt; if (it.x < it.def.r) { it.x = it.def.r; it.vx = Math.abs(it.vx); } if (it.x > W - it.def.r) { it.x = W - it.def.r; it.vx = -Math.abs(it.vx); } }
    if (!it.dead && it.y >= groundY - 6 && (it.mode === 'fall' || it.vy > 0)) {
      it.dead = true;
      if (it.def.good) {
        if (G.combo > 1 && mode === 'playing') addText(it.x, groundY - 40, 'combo lost', '#ffb3a8', 16, .8);
        if (mode === 'playing') { G.combo = 0; G.comboT = 0; }
        burst(it.x, groundY, [it.def.col[0], '#8a5a2b'], 5, 100, { g: 500, size: .8 });
        addText(it.x, groundY - 10, 'MISS', '#ffffff', 18, .7);
      } else addText(it.x, groundY - 24, '💚 safe!', '#bfffc8', 18, .9);
    }
  }
  G.items = G.items.filter(it => !it.dead);
  G.charX += (G.charTX - G.charX) * Math.min(1, dt * 12);
  if (G.swingT > 0) G.swingT -= dt; G.squash = Math.max(0, G.squash - dt * 6);
  for (const q of G.parts) {
    if (q.type === 'bone') { q.t += dt; if (q.t >= q.dur) { q.done = true; pulseBones(); } continue; }
    q.life -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
  }
  G.parts = G.parts.filter(q => q.type === 'bone' ? !q.done : (q.life > 0 && q.y < H + 80));
  for (const x of G.texts) { x.life -= dt; x.y += x.vy * dt; }
  G.texts = G.texts.filter(x => x.life > 0);
  for (const r of G.rings) r.t += dt;
  G.rings = G.rings.filter(r => r.t < r.life);
  for (const s of G.slams) s.t += dt;
  G.slams = G.slams.filter(s => s.t < .4);
  G.shake *= Math.pow(.001, dt); if (G.shake < .2) G.shake = 0;
  if (G.flash > 0) G.flash -= dt;
  if (mode === 'playing' || mode === 'ending') updateHud();
}
function updateAmbient(dt) {
  ambT -= dt;
  if (ambT <= 0) { ambT = .9; ambient.push({ def: pick((SETS[save.bg] || SETS.valley).good), x: rand(30, W - 30), y: -30, vy: rand(40, 70), rot: 0, vr: rand(-1, 1), ph: rand(0, 6), flash: 0, hp: 1, maxhp: 1 }); }
  for (const a of ambient) { a.y += a.vy * dt; a.rot += a.vr * dt; }
  while (ambient.length && ambient[0].y > groundY) ambient.shift();
}

/* ---------- HUD ---------- */
function updateHud() {
  if (!G) return;
  const sc = fmt(G.score); if (lastHud.score !== sc) { el.hScore.textContent = sc; lastHud.score = sc; }
  const b = Math.floor(G.bonesF); if (lastHud.bones !== b) { el.hBonesN.textContent = b; lastHud.bones = b; }
  const lv = G.lives + '/' + G.maxLives; if (lastHud.lives !== lv) { lastHud.lives = lv; let s = ''; for (let i = 0; i < G.maxLives; i++) s += i < G.lives ? '❤️' : '🖤'; el.hLives.textContent = s; }
  const left = Math.max(0, Math.ceil(DUR - G.time)); if (lastHud.time !== left) { lastHud.time = left; el.hTime.textContent = left; el.hTime.classList.toggle('low', left <= 5); el.timebar.classList.toggle('low', left <= 8); }
  el.timebar.firstElementChild.style.width = (clamp(1 - G.time / DUR, 0, 1) * 100).toFixed(1) + '%';
  const m = multOf(G.combo), on = G.combo >= 2;
  if (lastHud.on !== on) { lastHud.on = on; el.comboWrap.classList.toggle('on', on); }
  if (lastHud.combo !== G.combo) { lastHud.combo = G.combo; el.hCombo.textContent = G.combo + ' combo'; el.hMult.textContent = 'x' + m; if (G.combo > 0) el.hMult.animate([{ transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 160 }); }
  el.comboBar.style.width = (G.combo > 0 ? clamp(G.comboT / G.comboWin, 0, 1) * 100 : 0) + '%';
}
function pulseBones() { el.hBones.animate([{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 140 }); Snd.bone(); }

/* ---------- render ---------- */
function render() {
  if (!bgSky) return;
  const t = clock;
  drawSceneBase(t);
  const k = dpr * scale;
  ctx.save();
  if (!G || mode === 'menu' || mode === 'shop') {
    for (const a of ambient) { ctx.globalAlpha = .9; drawItem(ctx, a, t); }
    ctx.globalAlpha = 1;
    drawFront();
    drawChar(ctx, curChar(), W / 2, groundY + 16, clamp(H / 700, .8, 1.15) * (mode === 'menu' ? .88 : 1), { t, face: 1, tool: curTool() });
    ctx.restore(); return;
  }
  if (G.shake > 0) { const s = G.shake * (REDUCED ? .25 : 1); ctx.translate((Math.random() - .5) * s, (Math.random() - .5) * s); }
  const sw = G.swingT > 0;
  drawChar(ctx, G.ch, G.charX, groundY + 16, .82, { t, face: G.face, tool: G.tool, hideTool: sw, swing: sw ? 1 : 0, squash: G.squash, hop: Math.sin(clamp(1 - G.squash, 0, 1) * Math.PI) * 6 * G.squash });
  for (const it of G.items) drawItem(ctx, it, t);
  drawFront();
  for (const r of G.rings) { const p = r.t / r.life; ctx.strokeStyle = r.col; ctx.globalAlpha = 1 - p; ctx.lineWidth = 6 * (1 - p) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, lerp(r.r, r.max, 1 - Math.pow(1 - p, 2)), 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1;
  for (const s of G.slams) {
    const e = clamp(s.t / .26, 0, 1), ease = 1 - Math.pow(1 - e, 3);
    ctx.save(); ctx.translate(s.x, s.y); ctx.globalAlpha = s.t < .2 ? 1 : clamp(1 - (s.t - .2) / .2, 0, 1);
    ctx.translate(0, -(1 - ease) * 70); ctx.rotate(lerp(-1.4, -.45, ease)); ctx.scale(1.25, 1.25);
    ctx.translate(0, 70 * .86); drawTool(ctx, s.tool, 70, t); ctx.restore();
  }
  for (const q of G.parts) {
    if (q.type === 'bone') {
      if (q.t < 0) continue;
      const e = clamp(q.t / q.dur, 0, 1), ee = e * e * (3 - 2 * e);
      const bx = lerp(q.sx + q.ox * (1 - e), bonesTarget.x, ee), by = lerp(q.sy, bonesTarget.y, ee) - Math.sin(e * Math.PI) * 50;
      ctx.save(); ctx.translate(bx, by); ctx.rotate(e * 8); ctx.fillStyle = '#000'; ctx.font = '20px ' + EMOJI; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🦴', 0, 0); ctx.restore();
      continue;
    }
    ctx.globalAlpha = clamp(q.life / q.max * 1.5, 0, 1); ctx.fillStyle = q.col;
    if (q.type === 'rect') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillRect(-q.size / 2, -q.size / 2, q.size, q.size * .6); ctx.restore(); }
    else if (q.type === 'circ') { ctx.beginPath(); ctx.arc(q.x, q.y, q.size * .6, 0, 7); ctx.fill(); }
    else if (q.type === 'star') star(ctx, q.x, q.y, q.size * 1.5, q.rot);
    else if (q.type === 'emoji') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillStyle = '#000'; ctx.font = Math.round(q.size) + 'px ' + EMOJI; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(q.e, 0, 0); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const x of G.texts) {
    const age = x.max - x.life, pop = 1 + .35 * Math.max(0, 1 - age * 7), a = clamp(x.life / .35, 0, 1);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(clamp(x.x, 70, W - 70), x.y); ctx.scale(pop, pop);
    ctx.font = '900 ' + x.size + 'px ' + FONT; ctx.lineWidth = Math.max(4, x.size * .22); ctx.strokeStyle = INK; ctx.strokeText(x.text, 0, 0); ctx.fillStyle = x.col; ctx.fillText(x.text, 0, 0); ctx.restore();
  }
  if (G.hint > 0 && mode === 'playing') {
    ctx.save(); ctx.globalAlpha = clamp(G.hint, 0, 1); ctx.textAlign = 'center';
    ctx.font = '900 26px ' + FONT; ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.fillStyle = '#fff';
    ctx.strokeText('TAP to smash stuff!', W / 2, H * .5); ctx.fillText('TAP to smash stuff!', W / 2, H * .5);
    ctx.font = '900 18px ' + FONT; ctx.lineWidth = 5; ctx.fillStyle = '#bfffc8';
    const sp = 'Spare the cute critters ' + G.set.bad.map(x => x.e).join('') + '💚'; ctx.strokeText(sp, W / 2, H * .5 + 34); ctx.fillText(sp, W / 2, H * .5 + 34);
    ctx.restore();
  }
  if (G.flash > 0) { ctx.fillStyle = 'rgba(255,40,30,' + Math.min(.45, G.flash) + ')'; ctx.fillRect(-20, -20, W + 40, H + 40); }
  ctx.restore();
}

/* ====================== LOOP & INPUT ====================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  if (mode !== 'paused') update(dt);
  render();
  requestAnimationFrame(frame);
}
cv.addEventListener('touchstart', e => e.preventDefault(), { passive: false }); // stops Chrome's tap-snapping to nearby HUD buttons
cv.addEventListener('pointerdown', e => {
  Snd.init();
  if (mode !== 'playing') return;
  e.preventDefault();
  const r = cv.getBoundingClientRect(), s = r.width / W;
  smash((e.clientX - r.left) / s, (e.clientY - r.top) / s);
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { if (mode === 'playing') pauseGame(); else if (mode === 'paused') resumeGame(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'playing') pauseGame(); Snd.hidden(document.hidden); });
window.addEventListener('pagehide', () => Snd.hidden(true));
window.addEventListener('pageshow', () => Snd.hidden(false));
// real user gestures: create/resume audio on every one until it is running (iOS only honours touchend/click, not touchstart)
['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, () => Snd.gesture(), { capture: true, passive: true }));
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
function pauseGame() { if (mode !== 'playing') return; mode = 'paused'; show(el.pause); }
function resumeGame() { if (mode !== 'paused') return; mode = 'playing'; hide(el.pause); last = performance.now(); }

/* ====================== MENU ====================== */
function showMenu() {
  mode = 'menu'; G = null; hide(el.hud, el.shop, el.over, el.pause); show(el.menu); $('btnMute').classList.remove('hud');
  refreshMenu();
}
function refreshMenu() {
  $('mBest').textContent = fmt(save.high); $('mBones').textContent = fmt(save.bones);
  $('mEquip').textContent = curChar().name + '  •  ' + curTool().name;
  const b = $('btnDaily'), av = dailyAvailable();
  b.disabled = !av; b.classList.toggle('ready', av);
  b.textContent = av ? '🎁 DAILY BONUS +' + dailyAmount() + ' 🦴' : '✅ Daily claimed – back tomorrow';
  updateMuteBtn();
}
function updateMuteBtn() { $('btnMute').textContent = save.mute ? '🔇' : '🔊'; }
function toast(msg) { el.toast.textContent = msg; el.toast.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.toast.classList.remove('on'), 1800); }

$('btnPlay').onclick = () => { Snd.init(); Snd.click(); newRound(); };
$('btnShop').onclick = () => { Snd.init(); Snd.click(); openShop(); };
$('btnDaily').onclick = () => {
  Snd.init(); if (!dailyAvailable()) return;
  const amt = dailyAmount(); save.streak = nextStreak(); save.lastDaily = today(); save.bones += amt; persist();
  Snd.daily(); toast('🎁 +' + amt + ' bones!  Streak: ' + save.streak + ' day' + (save.streak > 1 ? 's' : '')); refreshMenu();
};
// HUD buttons fire on pointerdown so Chrome's tap-snapping can't trigger them from a near-miss smash tap (keyboard clicks have detail 0)
function hudBtn(id, fn) { const b = $(id); b.addEventListener('pointerdown', e => { e.preventDefault(); fn(); }); b.addEventListener('click', e => { if (e.detail === 0) fn(); }); }
hudBtn('btnMute', () => { Snd.init(); save.mute = !save.mute; persist(); updateMuteBtn(); Snd.setMute(save.mute); if (!save.mute) Snd.click(); });
hudBtn('btnPause', () => { Snd.click(); pauseGame(); });
$('btnResume').onclick = () => { Snd.click(); resumeGame(); };
$('btnQuit').onclick = () => { Snd.click(); showMenu(); };
$('btnAgain').onclick = () => { Snd.click(); newRound(); };
$('btnOShop').onclick = () => { Snd.click(); openShop(); };
$('btnOMenu').onclick = () => { Snd.click(); showMenu(); };
$('btnBack').onclick = () => { Snd.click(); showMenu(); };

/* ====================== SHOP ====================== */
let shopTab = 'chars';
function openShop() { mode = 'shop'; G = null; hide(el.menu, el.over, el.hud, el.pause); show(el.shop); $('btnMute').classList.remove('hud'); renderShop(true); }
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { if (shopTab === t.dataset.tab) return; Snd.click(); shopTab = t.dataset.tab; renderShop(true); });
const SHOPDATA = { chars: () => [CHARS, save.ownedChars], tools: () => [TOOLS, save.ownedTools], bgs: () => [BGS, save.ownedBgs] };
const SHOPTAB = { chars: 'tabChars', tools: 'tabTools', bgs: 'tabBgs' };
function affordableCount(kind) { const [list, owned] = SHOPDATA[kind](); return list.filter(x => !owned.includes(x.id) && x.price <= save.bones).length; }
function renderShop(resetScroll) {
  const list = $('shopList'), st = list.scrollTop;
  $('sBones').textContent = fmt(save.bones);
  ['chars', 'tools', 'bgs'].forEach(k => {
    const tab = $(SHOPTAB[k]); tab.classList.toggle('active', shopTab === k);
    const old = tab.querySelector('.dot'); if (old) old.remove(); const n = affordableCount(k);
    if (n > 0) { const d = document.createElement('span'); d.className = 'dot'; d.textContent = n; tab.appendChild(d); }
  });
  list.innerHTML = '';
  const [data, owned] = SHOPDATA[shopTab](), eq = shopTab === 'chars' ? save.char : shopTab === 'tools' ? save.tool : save.bg;
  const kind = shopTab;
  for (const it of data) {
    const isOwned = owned.includes(it.id), isEq = eq === it.id, canBuy = save.bones >= it.price;
    const card = document.createElement('div'); card.className = 'item' + (isEq ? ' equipped' : '') + (!isOwned ? ' locked' : ''); card.dataset.id = it.id;
    const pc = document.createElement('canvas'); pc.className = 'portrait'; pc.width = 220; pc.height = 220; if (kind === 'bgs') pc.classList.add('bgp'); card.appendChild(pc);
    drawPortrait(pc, kind, it);
    if (kind === 'chars') { const g = document.createElement('div'); g.className = 'gtag ' + it.g; g.textContent = it.g === 'f' ? '♀ Cavewoman' : '♂ Caveman'; card.appendChild(g); }
    if (!isOwned) { const l = document.createElement('div'); l.className = 'lock'; l.textContent = '🔒'; card.appendChild(l); }
    const nm = document.createElement('div'); nm.className = 'iname'; nm.textContent = it.name; card.appendChild(nm);
    if (kind === 'chars') { const p = document.createElement('div'); p.className = 'iperk'; p.textContent = it.perk; card.appendChild(p); }
    else if (kind === 'bgs') {
      const S = SETS[it.id], row = (cls, arr) => { const d = document.createElement('div'); d.className = 'emrow ' + cls; d.textContent = arr.map(x => x.e || (x.gold ? '🌟' : '❄️')).join(' '); return d; };
      const sm = row('good', S.good.filter(x => !x.late).slice(0, 3).concat(S.golden)); sm.title = 'Smash these'; card.appendChild(sm);
      const av = row('bad', S.bad); av.title = 'Spare these'; card.appendChild(av);
      const p = document.createElement('div'); p.className = 'iperk'; p.textContent = it.desc; card.appendChild(p);
    } else {
      const ch = document.createElement('div'); ch.className = 'chips';
      ['◎ Radius ' + it.radius, '💥 Dmg ' + it.dmg].forEach(x => { const c = document.createElement('span'); c.className = 'chip'; c.textContent = x; ch.appendChild(c); });
      card.appendChild(ch);
      const p = document.createElement('div'); p.className = 'iperk'; p.textContent = it.eff; card.appendChild(p);
    }
    const btn = document.createElement('button'); btn.className = 'ibtn'; btn.dataset.action = isEq ? 'equipped' : isOwned ? 'equip' : canBuy ? 'buy' : 'cant';
    if (isEq) { btn.classList.add('on'); btn.textContent = '✓ EQUIPPED'; btn.disabled = true; }
    else if (isOwned) { btn.classList.add('equip'); btn.textContent = 'EQUIP'; btn.onclick = () => equip(kind, it.id); }
    else if (canBuy) { btn.textContent = 'BUY  🦴 ' + fmt(it.price); btn.onclick = () => buy(kind, it.id); }
    else { btn.classList.add('cant'); btn.textContent = '🔒 ' + fmt(it.price) + ' 🦴'; btn.onclick = () => { Snd.fail(); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); toast('Need ' + fmt(it.price - save.bones) + ' more bones!'); }; }
    card.appendChild(btn);
    const need = document.createElement('div'); need.className = 'need'; need.textContent = (!isOwned && !canBuy) ? 'Need ' + fmt(it.price - save.bones) + ' more 🦴' : ''; card.appendChild(need);
    list.appendChild(card);
  }
  list.scrollTop = resetScroll ? 0 : st;
}
function drawPortrait(canvas, kind, it) {
  if (kind === 'bgs') { previewBG(canvas, it.id); return; }
  const c = canvas.getContext('2d'); c.clearRect(0, 0, 220, 220);
  c.save(); c.scale(2, 2);
  c.fillStyle = 'rgba(0,0,0,.15)'; c.beginPath(); c.ellipse(55, 100, 34, 6, 0, 0, 7); c.fill();
  if (kind === 'chars') drawChar(c, it, 55, 98, it.look.mount ? .62 : .8, { t: 0, face: 1, tool: null });
  else { c.translate(55, 96); c.rotate(.5); c.scale(.95, .95); c.translate(0, 8); drawTool(c, it, 78, 1.2); }
  c.restore();
}
function setEquipped(kind, id) { if (kind === 'chars') save.char = id; else if (kind === 'tools') save.tool = id; else { save.bg = id; buildBG(); } }
function buy(kind, id) {
  const [list, owned] = SHOPDATA[kind](), it = byId(list, id);
  if (!it || owned.includes(id)) return;
  if (save.bones < it.price) { Snd.fail(); toast('Need ' + fmt(it.price - save.bones) + ' more bones!'); return; }
  save.bones -= it.price; owned.push(id);
  setEquipped(kind, id);
  persist(); Snd.buy(); toast('🎉 ' + it.name + ' bought & equipped!'); renderShop(false);
}
function equip(kind, id) {
  const owned = SHOPDATA[kind]()[1];
  if (!owned.includes(id)) return;
  setEquipped(kind, id);
  persist(); Snd.click(); toast('Equipped!'); renderShop(false);
}

/* ====================== BOOT ====================== */
window.__bonk = { Snd, SETS, BGS, buildBG, get G() { return G; }, get mode() { return mode; }, save, W, get H() { return H; }, CHARS, TOOLS, GOOD, BAD, DUR, get scale() { return scale; }, buy, equip, multOf, smash, get groundY() { return groundY; }, KEY };
resize(); showMenu(); requestAnimationFrame(frame);
})();
</script>
